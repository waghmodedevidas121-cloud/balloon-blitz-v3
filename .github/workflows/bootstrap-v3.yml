name: Bootstrap Balloon Blitz V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-v3
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-v3
          fetch-depth: 0
      - name: Import audited V2 baseline
        run: |
          git clone --depth 1 https://github.com/waghmodedevidas121-cloud/balloon-blitz-v2.git /tmp/balloon-blitz-v2
          rsync -a --exclude='.git' /tmp/balloon-blitz-v2/ ./
      - name: Apply V3 hardening
        run: node scripts/harden-v3.mjs
      - name: Verify V3
        run: npm test
      - name: Commit V3 baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: establish production-hardened V3 baseline'
            git push origin production-v3
          fi
