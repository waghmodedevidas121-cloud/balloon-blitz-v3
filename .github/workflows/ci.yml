name: V3 CI

on:
  push:
    branches: [main, production-v3]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
